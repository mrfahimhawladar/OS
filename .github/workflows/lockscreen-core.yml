name: Lock screen native core

on:
  push:
    branches: [main]
    paths:
      - "mobile/systemui/lockscreen/native/**"
      - "mobile/systemui/runtime/**"
      - "mobile/systemui/CMakeLists.txt"
      - ".github/workflows/lockscreen-core.yml"
  pull_request:
    paths:
      - "mobile/systemui/lockscreen/native/**"
      - "mobile/systemui/runtime/**"
      - "mobile/systemui/CMakeLists.txt"
      - ".github/workflows/lockscreen-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lockscreen-native-core
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch pinned OP-TEE Client API source
        run: |
          git clone https://github.com/OP-TEE/optee_client.git third_party/optee_client
          git -C third_party/optee_client checkout 9f4414f62dfc5692fd39f760515ce2d344d07b6d

      - name: Build upstream GlobalPlatform libteec
        run: |
          cmake -S third_party/optee_client -B third_party/optee_client/build \
            -DWITH_TEEACL=OFF -DWITH_ASTEEC=OFF
          cmake --build third_party/optee_client/build --target teec --parallel 2
          test -e third_party/optee_client/build/libteec/libteec.a

      - name: Configure SystemUI (fail-closed transport stub)
        run: cmake -S mobile/systemui -B build/systemui

      - name: Configure SystemUI (real GlobalPlatform TEEC client)
        run: |
          cmake -S mobile/systemui -B build/systemui-optee \
            -DFAHIM_ENABLE_OPTEE_CLIENT=ON \
            -DFAHIM_TEEC_INCLUDE_DIR="$GITHUB_WORKSPACE/third_party/optee_client/libteec/include" \
            -DFAHIM_TEEC_LIBRARY="$GITHUB_WORKSPACE/third_party/optee_client/build/libteec/libteec.a"

      - name: Build SystemUI components
        run: |
          cmake --build build/systemui --parallel 2
          cmake --build build/systemui-optee --parallel 2

      - name: Run SystemUI tests (fail-closed stub)
        run: ctest --test-dir build/systemui --output-on-failure

      - name: Run SystemUI tests (TEEC client branch)
        run: ctest --test-dir build/systemui-optee --output-on-failure
