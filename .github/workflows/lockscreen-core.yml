name: Lock screen native core

on:
  push:
    branches: [main]
    paths:
      - "mobile/systemui/lockscreen/native/**
      - "mobile/systemui/runtime/**"
      - "mobile/systemui/CMakeLists.txt""
      - ".github/workflows/lockscreen-core.yml"
  pull_request:
    paths:
      - "mobile/systemui/lockscreen/native/**"
      - ".github/workflows/lockscreen-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lockscreen-native-core
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure native component
        run: cmake -S mobile/systemui -B build/systemui

      - name: Build native component
        run: cmake --build build/systemui --parallel 2

      - name: Run tests
        run: ctest --test-dir build/systemui --output-on-failure
