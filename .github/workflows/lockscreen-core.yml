name: Lock screen native core

on:
  push:
    branches: [main, feature/native-system-shell]
    paths:
      - "mobile/systemui/lockscreen/native/**"
      - "mobile/systemui/runtime/**"
      - "mobile/systemui/CMakeLists.txt"
      - ".github/workflows/lockscreen-core.yml"
      - "tools/ppm_to_png.py"
  pull_request:
    paths:
      - "mobile/systemui/lockscreen/native/**"
      - "mobile/systemui/runtime/**"
      - "mobile/systemui/CMakeLists.txt"
      - ".github/workflows/lockscreen-core.yml"
      - "tools/ppm_to_png.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lockscreen-native-core
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure SystemUI
        run: cmake -S mobile/systemui -B build/systemui

      - name: Build SystemUI and native renderer snapshot tool
        run: cmake --build build/systemui --parallel 2

      - name: Run native component tests
        run: ctest --test-dir build/systemui --output-on-failure

      - name: Render screenshots from the actual C++ Lock Screen renderer
        run: |
          mkdir -p artifacts
          ./build/systemui/runtime/native_lockscreen_snapshot artifacts
          python3 tools/ppm_to_png.py artifacts/native-lockscreen.ppm artifacts/native-lockscreen.png
          python3 tools/ppm_to_png.py artifacts/native-pin-bouncer.ppm artifacts/native-pin-bouncer.png
          file artifacts/*.png
          test -s artifacts/native-lockscreen.png
          test -s artifacts/native-pin-bouncer.png

      - name: Upload native C++ Lock Screen screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fahim-os-native-lockscreen-render
          path: artifacts/*.png
          if-no-files-found: error
          retention-days: 14
