name: OP-TEE credential Trusted Application

on:
  push:
    branches: [main]
    paths:
      - "mobile/systemui/tee/**"
      - "mobile/systemui/runtime/include/fahim/security/**"
      - "mobile/systemui/runtime/src/TeeCredentialBackend.cpp"
      - ".github/workflows/optee-credential-ta.yml"
  pull_request:
    paths:
      - "mobile/systemui/tee/**"
      - "mobile/systemui/runtime/include/fahim/security/**"
      - "mobile/systemui/runtime/src/TeeCredentialBackend.cpp"
      - ".github/workflows/optee-credential-ta.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optee-credential-ta
  cancel-in-progress: true

jobs:
  build-secure-ta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Fahim OS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install OP-TEE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3 python3-pip python3-cryptography \
            python3-pycryptodome python3-pyelftools python3-serial \
            python3-yaml libssl-dev libelf-dev device-tree-compiler flex bison \
            gcc-aarch64-linux-gnu

      - name: Fetch pinned OP-TEE OS source
        run: |
          git clone --recursive https://github.com/OP-TEE/optee_os.git third_party/optee_os
          git -C third_party/optee_os checkout bffdda07ee61910cc63f45c45838fb2b59288c71
          git -C third_party/optee_os submodule update --init --recursive

      - name: Add the fail-closed Fahim Trusted UI pseudo-TA overlay
        run: |
          cp mobile/systemui/tee/platform/optee/fahim_tui_pta.c third_party/optee_os/core/pta/fahim_tui_pta.c
          cp mobile/systemui/tee/platform/optee/fahim_tui_platform_hal.h third_party/optee_os/core/pta/fahim_tui_platform_hal.h
          cp mobile/systemui/tee/include/fahim_tui_protocol.h third_party/optee_os/core/pta/fahim_tui_protocol.h
          printf '\nsrcs-y += fahim_tui_pta.c\n' >> third_party/optee_os/core/pta/sub.mk

      - name: Export the OP-TEE ARM64 TA developer kit
        run: |
          make -C third_party/optee_os \
            CFG_ARM64_core=y \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_core=aarch64-linux-gnu- \
            CROSS_COMPILE_ta_arm64=aarch64-linux-gnu- \
            O=out/arm \
            PLATFORM=vexpress-qemu_armv8a \
            CFG_USER_TA_TARGETS=ta_arm64 \
            ta_dev_kit

      - name: Build Fahim OS credential Trusted Application
        run: |
          make -C mobile/systemui/tee/credential_ta \
            TA_DEV_KIT_DIR="$GITHUB_WORKSPACE/third_party/optee_os/out/arm/export-ta_arm64" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            O=build

      - name: Build Fahim OS trusted PIN provisioner TA
        run: |
          make -C mobile/systemui/tee/provisioner_ta \
            TA_DEV_KIT_DIR="$GITHUB_WORKSPACE/third_party/optee_os/out/arm/export-ta_arm64" \
            CROSS_COMPILE=aarch64-linux-gnu- O=build

      - name: Inspect Trusted Application outputs
        run: |
          test -s mobile/systemui/tee/credential_ta/build/9f4d1e72-6a0b-4a31-9b60-464148494d43.ta
          test -s mobile/systemui/tee/credential_ta/build/9f4d1e72-6a0b-4a31-9b60-464148494d43.elf
          test -s mobile/systemui/tee/provisioner_ta/build/28e3b2d4-4a20-4f91-9a11-464148494d50.ta
          test -s mobile/systemui/tee/provisioner_ta/build/28e3b2d4-4a20-4f91-9a11-464148494d50.elf
          file mobile/systemui/tee/credential_ta/build/9f4d1e72-6a0b-4a31-9b60-464148494d43.ta
          file mobile/systemui/tee/provisioner_ta/build/28e3b2d4-4a20-4f91-9a11-464148494d50.ta
          aarch64-linux-gnu-readelf -h mobile/systemui/tee/credential_ta/build/9f4d1e72-6a0b-4a31-9b60-464148494d43.elf
          aarch64-linux-gnu-readelf -h mobile/systemui/tee/provisioner_ta/build/28e3b2d4-4a20-4f91-9a11-464148494d50.elf

      - name: Upload development-signed Secure Credential and Provisioner TAs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fahim-os-secure-enrollment-dev-signed
          path: |
            mobile/systemui/tee/credential_ta/build/9f4d1e72-6a0b-4a31-9b60-464148494d43.ta
            mobile/systemui/tee/provisioner_ta/build/28e3b2d4-4a20-4f91-9a11-464148494d50.ta
          if-no-files-found: error
          retention-days: 30
