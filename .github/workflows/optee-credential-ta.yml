name: OP-TEE credential Trusted Application

on:
  push:
    branches: [main]
    paths:
      - "mobile/systemui/tee/**"
      - "mobile/systemui/runtime/include/fahim/security/**"
      - "mobile/systemui/runtime/src/TeeCredentialBackend.cpp"
      - ".github/workflows/optee-credential-ta.yml"
  pull_request:
    paths:
      - "mobile/systemui/tee/**"
      - "mobile/systemui/runtime/include/fahim/security/**"
      - "mobile/systemui/runtime/src/TeeCredentialBackend.cpp"
      - ".github/workflows/optee-credential-ta.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optee-credential-ta
  cancel-in-progress: true

jobs:
  build-secure-ta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Fahim OS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install OP-TEE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3 python3-pip python3-cryptography \
            python3-pycryptodome python3-pyelftools python3-serial \
            python3-yaml libssl-dev libelf-dev device-tree-compiler flex bison \
            gcc-aarch64-linux-gnu

      - name: Fetch pinned OP-TEE OS source
        run: |
          git clone --recursive https://github.com/OP-TEE/optee_os.git third_party/optee_os
          git -C third_party/optee_os checkout bffdda07ee61910cc63f45c45838fb2b59288c71
          git -C third_party/optee_os submodule update --init --recursive

      - name: Export the OP-TEE ARM64 TA developer kit
        run: |
          make -C third_party/optee_os \
            CFG_ARM64_core=y \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_core=aarch64-linux-gnu- \
            CROSS_COMPILE_ta_arm64=aarch64-linux-gnu- \
            O=out/arm \
            PLATFORM=vexpress-qemu_armv8a \
            export-ta_arm64

      - name: Build Fahim OS credential Trusted Application
        run: |
          make -C mobile/systemui/tee/credential_ta \
            TA_DEV_KIT_DIR="$GITHUB_WORKSPACE/third_party/optee_os/out/arm/export-ta_arm64" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            PLATFORM=vexpress-qemu_armv8a

      - name: Inspect Trusted Application ELF
        run: |
          file mobile/systemui/tee/credential_ta/9f4d1e72-6a0b-4a31-9b60-464148494d43.elf
          aarch64-linux-gnu-readelf -h mobile/systemui/tee/credential_ta/9f4d1e72-6a0b-4a31-9b60-464148494d43.elf
