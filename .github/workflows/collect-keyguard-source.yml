name: Collect Android 17 Keyguard source

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collect-keyguard-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android17-keyguard-source
  cancel-in-progress: true

jobs:
  collect:
    name: Collect focused Keyguard and lock-screen source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download focused Official AOSP source directories
        shell: bash
        run: |
          set -euo pipefail

          REF="refs/heads/android17-release"
          ROOT="$GITHUB_WORKSPACE/collected"
          mkdir -p "$ROOT"

          download_gitiles_archive() {
            local project="$1"
            local subpath="$2"
            local destination="$3"
            local url="https://android.googlesource.com/$project/+archive/$REF"

            if [[ -n "$subpath" ]]; then
              url+="/$subpath"
            fi
            url+=".tar.gz"

            mkdir -p "$destination"
            local archive="/tmp/$(echo "$project-$subpath" | tr '/ ' '__').tar.gz"

            echo "Downloading official source: $project/$subpath"
            curl --fail --location --show-error --silent \
              --retry 4 --retry-all-errors --connect-timeout 20 --max-time 600 \
              "$url" --output "$archive"

            tar -tzf "$archive" >/dev/null
            tar -xzf "$archive" -C "$destination"
            rm -f "$archive"
          }

          download_gitiles_file() {
            local project="$1"
            local path="$2"
            local destination="$3"
            local url="https://android.googlesource.com/$project/+/$REF/$path?format=TEXT"
            local encoded="/tmp/$(echo "$project-$path" | tr '/ ' '__').b64"

            mkdir -p "$(dirname "$destination")"
            echo "Downloading build metadata: $project/$path"
            curl --fail --location --show-error --silent \
              --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 \
              "$url" --output "$encoded"
            base64 --decode "$encoded" > "$destination"
            rm -f "$encoded"
          }

          # Keyguard's lock-screen state, UI, and view-model source.
          download_gitiles_archive \
            "platform/frameworks/base" \
            "packages/SystemUI/src/com/android/systemui/keyguard" \
            "$ROOT/frameworks/base/packages/SystemUI/src/com/android/systemui/keyguard"

          # PIN, password, pattern, clock, carrier and security-entry UI.
          download_gitiles_archive \
            "platform/frameworks/base" \
            "packages/SystemUI/src/com/android/keyguard" \
            "$ROOT/frameworks/base/packages/SystemUI/src/com/android/keyguard"

          # Lock-screen bouncer, biometrics and clock UI modules.
          download_gitiles_archive \
            "platform/frameworks/base" \
            "packages/SystemUI/src/com/android/systemui/bouncer" \
            "$ROOT/frameworks/base/packages/SystemUI/src/com/android/systemui/bouncer"

          download_gitiles_archive \
            "platform/frameworks/base" \
            "packages/SystemUI/src/com/android/systemui/biometrics" \
            "$ROOT/frameworks/base/packages/SystemUI/src/com/android/systemui/biometrics"

          download_gitiles_archive \
            "platform/frameworks/base" \
            "packages/SystemUI/src/com/android/systemui/clock" \
            "$ROOT/frameworks/base/packages/SystemUI/src/com/android/systemui/clock"

          # Native layouts, drawables, dimensions and strings used by Keyguard.
          download_gitiles_archive \
            "platform/frameworks/base" \
            "packages/SystemUI/res-keyguard" \
            "$ROOT/frameworks/base/packages/SystemUI/res-keyguard"

          # The first-level shared libraries referenced by SystemUI's build rules.
          download_gitiles_archive \
            "platform/frameworks/libs/systemui" \
            "" \
            "$ROOT/frameworks/libs/systemui"

          download_gitiles_archive \
            "platform/frameworks/libs/modules-utils" \
            "" \
            "$ROOT/frameworks/libs/modules-utils"

          # Preserve the exact module metadata needed to inspect transitive deps.
          download_gitiles_file \
            "platform/frameworks/base" \
            "packages/SystemUI/Android.bp" \
            "$ROOT/frameworks/base/packages/SystemUI/Android.bp"

          download_gitiles_file \
            "platform/frameworks/base" \
            "packages/SystemUI/AndroidManifest.xml" \
            "$ROOT/frameworks/base/packages/SystemUI/AndroidManifest.xml"

          cat > "$ROOT/SOURCE-INFO.txt" <<EOF
          Android release branch: android17-release
          Upstream: Official Android Open Source Project (AOSP) at android.googlesource.com
          Retrieved at (UTC): $(date -u +%FT%TZ)

          Focused source included:
            - platform/frameworks/base/packages/SystemUI/src/com/android/systemui/keyguard
            - platform/frameworks/base/packages/SystemUI/src/com/android/keyguard
            - platform/frameworks/base/packages/SystemUI/src/com/android/systemui/bouncer
            - platform/frameworks/base/packages/SystemUI/src/com/android/systemui/biometrics
            - platform/frameworks/base/packages/SystemUI/src/com/android/systemui/clock
            - platform/frameworks/base/packages/SystemUI/res-keyguard
            - platform/frameworks/base/packages/SystemUI/Android.bp
            - platform/frameworks/base/packages/SystemUI/AndroidManifest.xml
            - platform/frameworks/libs/systemui
            - platform/frameworks/libs/modules-utils

          Scope:
            Keyguard and lock-screen UI source plus first-level shared libraries.
            This is not a complete AOSP checkout and is not independently buildable.
            Android.bp references must be followed to resolve further transitive
            dependencies only when required for native integration/building.
          EOF

          echo "Collected source sizes:"
          du -sh "$ROOT/frameworks/base/packages/SystemUI/src/com/android/systemui/keyguard" \
                 "$ROOT/frameworks/base/packages/SystemUI/src/com/android/keyguard" \
                 "$ROOT/frameworks/base/packages/SystemUI/src/com/android/systemui/bouncer" \
                 "$ROOT/frameworks/base/packages/SystemUI/src/com/android/systemui/biometrics" \
                 "$ROOT/frameworks/base/packages/SystemUI/src/com/android/systemui/clock" \
                 "$ROOT/frameworks/base/packages/SystemUI/res-keyguard" \
                 "$ROOT/frameworks/libs/systemui" \
                 "$ROOT/frameworks/libs/modules-utils"
          echo "Total:"
          du -sh "$ROOT"

      - name: Package focused source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          zip -qr android17-keyguard-source.zip collected
          ls -lh android17-keyguard-source.zip
          unzip -t android17-keyguard-source.zip

      - name: Upload source artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android17-keyguard-source
          path: android17-keyguard-source.zip
          if-no-files-found: error
          retention-days: 14
