name: Build Fahim OS x86 Prototype

on:
  push:
    branches: [ main ]
    paths:
      - "kernel.cpp"
      - "boot.s"
      - "linker.ld"
      - "grub.cfg"
      - "Makefile"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "kernel.cpp"
      - "boot.s"
      - "linker.ld"
      - "grub.cfg"
      - "Makefile"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-multilib grub-pc-bin grub-common xorriso mtools

      - name: Build bootable ISO
        run: make

      - name: Upload ISO artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fahim-os-iso
          path: dist/fahim-os.iso
          if-no-files-found: error
