[package]
name = "fahim-gic-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
arm-gic = { version = "=0.10.0", default-features = false }
arm-generic-timer = { version = "=0.3.1", default-features = false, features = ["el1"] }
frame-alloc = { version = "=0.1.0", default-features = false, features = ["stats"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
